[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vvr-scraper"
version = "1.6.0"
description = "Công cụ tải web novel từ Valvrare Team (Async, Web UI & Download Queue)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Valvrare Team Crawler Contributors"}
]
dependencies = [
    "alive-progress==3.3.0",
    "beautifulsoup4==4.13.4",
    "EbookLib==0.19",
    "httpx>=0.28.0",
    "lxml>=6.0.0",
    "pillow>=11.3.0",
    "playwright>=1.54.0",
    "prompt-toolkit>=3.0.43",
    "reportlab>=4.4.3",
    "simple-term-menu>=1.6.6",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "aiosqlite>=0.19.0",
    "openai>=2.30.0",
]

[project.optional-dependencies]
audio = ["vieneu", "numpy"]

[project.scripts]
vvrt = "vvr_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vvr_scraper*"]
