[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vvr-scraper"
version = "0.2.0"
description = "Công cụ tải truyện CỰC ĐỘC ĐÁO từ Valvrareteam.net"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Valvrare Team Crawler Contributors"}
]
dependencies = [
    "alive-progress==3.3.0",
    "beautifulsoup4==4.13.4",
    "EbookLib==0.19",
    "httpx>=0.28.0",
    "lxml>=6.0.0",
    "pillow>=11.3.0",
    "playwright>=1.54.0",
    "prompt-toolkit>=3.0.43",
    "reportlab>=4.4.3",
    "simple-term-menu>=1.6.6",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "aiosqlite>=0.19.0",
    "openai>=2.30.0",
    "freesound-api>=1.0.0",
    "pydub>=0.25.1",
    "elevenlabs>=2.40.0",
    "audioop-lts; python_version >= '3.13'",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "PyJWT>=2.10.1",
    "bcrypt>=4.0.0",
]



[project.scripts]
vvrt = "vvr_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vvr_scraper*"]

[tool.setuptools.package-data]
"vvr_scraper" = ["static/*", "prompts/*.md"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "hypothesis>=6.98.0",
]

# === Ruff Linter Config ===
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (common bugs)
    "UP",   # pyupgrade (modern Python syntax)
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert usage (OK in tests)
    "S603",   # subprocess without shell=True (intentional)
    "S607",   # partial path for subprocess (intentional)
    "B008",   # function call in default arg (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]  # Relax security + bugbear rules in tests

# === Semantic Release Config ===
[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
major_on_zero = false
branch = "master"
upload_to_pypi = false
upload_to_release = true
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"
