# ============================================================
# VVR-Scraper Docker Compose
# Chạy: docker compose up -d
# ============================================================

services:
  # --- Web UI + OPDS Server ---
  vvr-web:
    build: .
    container_name: vvr-scraper
    restart: unless-stopped
    ports:
      - "${VVR_PORT:-8000}:8000"

    # API Keys & Config
    environment:
      # --- Dùng cho image generation ---
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # --- BẮT BUỘC cho Audio Drama / AI parsing ---
      - VVR_API_KEY=${VVR_API_KEY:-}
      - VVR_BASE_URL=${VVR_BASE_URL:-}
      - VVR_MODEL=${VVR_MODEL:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - VVR_NARRATOR_VOICE_ID=${VVR_NARRATOR_VOICE_ID:-}
      # --- Tùy chọn ---
      - FREESOUND_CLIENT_ID=${FREESOUND_CLIENT_ID:-}
      - FREESOUND_CLIENT_SECRET=${FREESOUND_CLIENT_SECRET:-}
      - VVR_SSR_URL=${VVR_SSR_URL:-val-ssr-2kzit.ondigitalocean.app}
      # --- OPDS Auth ---
      - VVR_OPDS_USER=${VVR_OPDS_USER:-admin}
      - VVR_OPDS_PASS=${VVR_OPDS_PASS:-}
      # --- Auto Sync ---
      - VVR_AUTO_SYNC=${VVR_AUTO_SYNC:-0}
      # --- Social Reader Auth ---
      - VVR_JWT_SECRET=${VVR_JWT_SECRET:-change-this-random-secret}
      - VVR_ADMIN_CODE=${VVR_ADMIN_CODE:-}

    volumes:
      # Thư mục truyện (persistent)
      - novels_data:/home/vvr/app/novels
      # Config + session + database (persistent)
      - vvr_config:/home/vvr/.config/vvr-scraper
      # BGM library (optional, mount host folder)
      # - ./bgm:/home/vvr/app/bgm:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Automated Backup ---
  db-backup:
    image: alpine:latest
    container_name: vvr-sqlite-backup
    restart: unless-stopped
    volumes:
      - vvr_config:/data:ro
      - vvr_backups:/backups
      - ./scripts/backup_sqlite.sh:/app/backup_sqlite.sh:ro
    # Run cron in foreground (daily at 2:00 AM)
    command: /bin/sh -c "apk add --no-cache sqlite && echo '0 2 * * * /app/backup_sqlite.sh' > /etc/crontabs/root && crond -f -d 8"
    depends_on:
      - vvr-web

  # --- Monitoring & Observability ---
  prometheus:
    image: prom/prometheus:latest
    container_name: vvr-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - vvr-web

  grafana:
    image: grafana/grafana:latest
    container_name: vvr-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  novels_data:
    driver: local
  vvr_config:
    driver: local
  vvr_backups:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
