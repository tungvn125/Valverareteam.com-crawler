            - heading "Auto-wait and web-first assertions" [level=4] [ref=e64]
            - paragraph [ref=e65]: Playwright waits for elements to be actionable before performing actions. Assertions automatically retry until conditions are met. No artificial timeouts, no flaky tests.
            - heading "Test isolation" [level=4] [ref=e66]
            - paragraph [ref=e67]: Each test gets a fresh browser context — equivalent to a brand new browser profile. Full isolation with near-zero overhead. Save authentication state once and reuse it across tests.
          - generic [ref=e68]:
            - heading "Resilient locators" [level=4] [ref=e69]
            - paragraph [ref=e70]:
